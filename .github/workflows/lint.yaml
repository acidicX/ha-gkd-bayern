name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Run ruff checks
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: latest
      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: latest
          args: "format --check"
